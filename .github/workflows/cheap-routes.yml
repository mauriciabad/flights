name: Cheap routes

# Issue #52: Travelpayouts sends no CORS headers (docs/PROVIDERS.md), so the
# browser cannot call it. This runs the fetch server-side, on a schedule, and
# commits the result as a static JSON asset instead -- the no-backend rule bans
# a server at runtime, not a build step.
on:
  schedule:
    # 03:17 UTC nightly. An off-the-hour minute so this doesn't queue behind
    # every other repo's cron jobs firing exactly on the hour.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cheap-routes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No pnpm/install step: this script has no dependency beyond Node's own
      # fetch and fs/promises, so it runs standalone.
      - name: Fetch cheap routes
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: node scripts/fetch-cheap-routes.mjs

      # Issue #169: this lands a commit every night now, even when no price moved,
      # because the dataset carries a `fetchedAt` and that advances every run. The
      # same trade the ryanair-network job next door already makes, for the same
      # reason: the app reports this stamp as the data's age, so a date that stopped
      # advancing would make freshly-confirmed prices look weeks old.
      #
      # The three options were: accept the nightly no-op commit; bump the stamp only
      # when the data changed, which turns it into "when this data was last
      # different" and would then have to be named that; or leave it stale between
      # changes, which is simply false. Only the first keeps the field's name honest.
      #
      # Nothing is lost by dropping the changed-data guard: `routes` is still sorted
      # for a stable diff, so `git show` on one of these commits still says plainly
      # whether any price moved or only the stamp did. The guard below now catches
      # just the case where the script wrote nothing at all.
      - name: Commit the dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/lib/data/cheap-routes.generated.json; then
            echo "Cheap routes file unchanged (script wrote nothing), nothing to commit."
            exit 0
          fi
          git add src/lib/data/cheap-routes.generated.json
          git commit -m "Update cheap routes data"
          git push
